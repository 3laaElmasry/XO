<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>XO أونلاين</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    :root {
      color-scheme: light;
      --night: #102725;
      --night-soft: #183632;
      --paper: #f0f3ee;
      --paper-deep: #e4ebe5;
      --ink: #17332f;
      --muted: #71827b;
      --line: #d2ddd5;
      --x: #c45f4d;
      --o: #287e71;
      --brass: #c7a96b;
      --white: #fff;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--night);
      color: var(--ink);
      font-family: "IBM Plex Sans Arabic", sans-serif;
      display: flex;
      justify-content: center;
      padding: 30px 18px
    }

    button,
    input {
      font: inherit
    }

    button {
      border: 0;
      cursor: pointer;
      transition: transform .18s, background .18s, color .18s
    }

    button:focus-visible,
    input:focus-visible,
    .cell:focus-visible {
      outline: 3px solid var(--brass);
      outline-offset: 3px
    }

    button:disabled {
      opacity: .5;
      cursor: default
    }

    .wrap {
      width: 100%;
      max-width: 960px
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin: 0 4px 22px;
      color: var(--paper)
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px
    }

    .brand-mark {
      font-family: "DM Sans", sans-serif;
      font-size: 25px;
      font-weight: 700;
      letter-spacing: 0
    }

    .brand-mark .x {
      color: var(--x)
    }

    .brand-mark .o {
      color: var(--o)
    }

    h1 {
      margin: 0;
      font-size: 18px;
      font-weight: 600
    }

    .brand-note {
      color: #a6b8af;
      font-size: 13px
    }

    .card {
      background: var(--paper);
      border: 1px solid rgba(255, 255, 255, .1);
      border-radius: 10px;
      padding: 24px
    }

    .lobby {
      max-width: 640px;
      margin: 48px auto 0;
      padding: 44px;
      text-align: center
    }

    .lobby-mark {
      font-family: "DM Sans", sans-serif;
      font-size: 64px;
      font-weight: 700;
      line-height: 1;
      margin-bottom: 18px
    }

    .lobby-mark .x {
      color: var(--x)
    }

    .lobby-mark .o {
      color: var(--o)
    }

    .lobby p {
      margin: 0 0 24px;
      color: var(--muted);
      font-size: 16px
    }

    .primary {
      background: var(--night);
      color: var(--paper);
      border-radius: 7px;
      padding: 12px 24px;
      font-weight: 600
    }

    .primary:hover:not(:disabled) {
      background: var(--night-soft);
      transform: translateY(-1px)
    }

    .linkbox {
      display: flex;
      gap: 8px;
      margin-top: 12px
    }

    .linkbox input,
    .chatform input {
      flex: 1;
      min-width: 0;
      background: var(--white);
      border: 1px solid var(--line);
      color: var(--ink);
      border-radius: 6px;
      padding: 11px 12px;
      font-size: 14px;
      direction: ltr
    }

    .muted {
      color: var(--muted);
      font-size: 14px
    }

    .game {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 16px;
      align-items: start
    }

    .game.chat-open {
      grid-template-columns: minmax(0, 1fr) 330px
    }

    .game-panel {
      min-width: 0;
      padding: 22px 28px 26px
    }

    .game-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 16px
    }

    .game-title {
      margin: 0;
      font-size: 17px;
      font-weight: 600
    }

    .score {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 12px
    }

    .score b {
      font-family: "DM Sans", sans-serif;
      font-size: 17px
    }

    .score b.x {
      color: var(--x)
    }

    .score b.o {
      color: var(--o)
    }

    .score-total {
      color: var(--ink);
      font-weight: 600
    }

    .chat-toggle {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      flex: none;
      background: var(--paper-deep);
      color: var(--ink);
      border: 1px solid var(--line);
      border-radius: 7px;
      padding: 9px 12px;
      font-weight: 600
    }

    .chat-toggle:hover {
      background: #dce7df
    }

    .chat-toggle svg {
      width: 19px;
      height: 19px
    }

    .badge {
      position: absolute;
      top: -7px;
      left: -7px;
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      border-radius: 20px;
      background: var(--x);
      color: var(--white);
      font: 700 11px/19px "DM Sans", sans-serif;
      text-align: center
    }

    .status {
      text-align: center;
      font-size: 18px;
      font-weight: 600;
      min-height: 30px;
      margin: 0 0 10px;
      color: var(--ink)
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 9px;
      max-width: 410px;
      margin: 0 auto;
      direction: ltr
    }

    .cell {
      aspect-ratio: 1;
      background: var(--paper-deep);
      border: 1px solid var(--line);
      border-radius: 7px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "DM Sans", sans-serif;
      font-size: clamp(40px, 9vw, 68px);
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: background .15s, transform .15s
    }

    .cell:hover {
      background: #dbe6dd
    }

    .cell.x {
      color: var(--x)
    }

    .cell.o {
      color: var(--o)
    }

    .cell.win {
      background: #d5e8d9;
      border-color: #9ebca3
    }

    .actions {
      text-align: center;
      margin-top: 16px
    }

    .chat {
      display: flex;
      flex-direction: column;
      height: 440px;
      padding: 0;
      overflow: hidden
    }

    .chat-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 15px 17px;
      border-bottom: 1px solid var(--line)
    }

    .chat-head h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600
    }

    .chat-close {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-size: 22px;
      line-height: 1
    }

    .chat-close:hover {
      background: var(--paper-deep);
      color: var(--ink)
    }

    .msgs {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 9px;
      padding: 16px
    }

    .msg {
      max-width: 85%;
      padding: 9px 12px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.55;
      overflow-wrap: anywhere
    }

    .msg.me {
      align-self: flex-start;
      background: var(--night);
      color: var(--paper)
    }

    .msg.them {
      align-self: flex-end;
      background: #dce9e2;
      color: var(--ink)
    }

    .msg.sys {
      align-self: center;
      background: transparent;
      color: var(--muted);
      font-size: 12px;
      text-align: center
    }

    .chatform {
      display: flex;
      gap: 7px;
      padding: 12px;
      border-top: 1px solid var(--line)
    }

    .chatform input {
      direction: rtl
    }

    .send-button {
      background: var(--night);
      color: var(--paper);
      border-radius: 6px;
      padding: 0 14px;
      font-weight: 600
    }

    .send-button:hover {
      background: var(--night-soft)
    }

    .hidden {
      display: none !important
    }

    @media(max-width:760px) {
      body {
        padding: 18px 12px
      }

      .masthead {
        margin-bottom: 16px
      }

      .brand-note {
        display: none
      }

      .lobby {
        margin: 30px auto 0;
        padding: 32px 20px
      }

      .game.chat-open {
        grid-template-columns: minmax(0, 1fr)
      }

      .game-panel {
        padding: 18px 14px 20px
      }

      .game-top {
        gap: 8px
      }

      .score {
        gap: 8px;
        font-size: 12px
      }

      .score b {
        font-size: 15px
      }

      .chat {
        height: min(380px, 55vh)
      }

      .board {
        gap: 7px
      }
    }

    @media(prefers-reduced-motion:reduce) {

      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition: none !important
      }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header class="masthead">
      <div class="brand"><span class="brand-mark"><span class="x">X</span><span class="o">O</span></span>
        <h1>أونلاين</h1>
      </div>
      <span class="brand-note">لعبة واحدة، منافسة حقيقية</span>
    </header>

    <!-- شاشة البداية -->
    <div id="lobby" class="card lobby">
      <div class="lobby-mark"><span class="x">X</span><span class="o">O</span></div>
      <p>اعمل غرفة وابعت اللينك لصاحبك عشان يلعب معاك.</p>
      <button id="createBtn" class="primary">إنشاء غرفة</button>
      <div id="waiting" class="hidden">
        <p class="muted">ابعت اللينك ده لصاحبك:</p>
        <div class="linkbox">
          <input id="linkInput" readonly>
          <button id="copyBtn" class="primary">نسخ</button>
        </div>
        <p class="muted" style="margin-top:14px">⏳ مستني صاحبك يدخل...</p>
      </div>
      <p id="lobbyMsg" class="muted"></p>
    </div>

    <!-- شاشة اللعب -->
    <div id="game" class="game hidden">
      <section class="card game-panel">
        <div class="game-top">
          <h2 class="game-title">مباراة ودية</h2>
          <button id="chatToggle" class="chat-toggle" type="button" aria-expanded="false" aria-controls="chatPanel">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round" aria-hidden="true">
              <path
                d="M21 11.5a8.4 8.4 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.4 8.4 0 0 1-3.8-.9L3 21l1.9-5.7a8.4 8.4 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.4 8.4 0 0 1 3.8-.9h.5a8.5 8.5 0 0 1 8 8v.5z" />
            </svg>
            <span>الدردشة</span><span id="chatBadge" class="badge hidden" aria-label="رسائل جديدة">0</span>
          </button>
        </div>
        <div class="score">
          <span>أنت <b id="youMark"></b></span>
          <span class="score-total"><b class="x">X</b> <span id="scoreX">0</span> - <span id="scoreO">0</span> <b
              class="o">O</b></span>
          <span>تعادل <b id="scoreD">0</b></span>
        </div>
        <div id="status" class="status"></div>
        <div id="board" class="board"></div>
        <div class="actions">
          <button id="againBtn" class="primary hidden">جولة جديدة</button>
        </div>
      </section>
      <aside id="chatPanel" class="card chat hidden" aria-label="الدردشة">
        <div class="chat-head">
          <h2>الدردشة</h2><button id="chatClose" class="chat-close" type="button" aria-label="إغلاق الدردشة">×</button>
        </div>
        <div id="msgs" class="msgs"></div>
        <form id="chatForm" class="chatform">
          <input id="chatInput" placeholder="اكتب رسالة..." maxlength="300" autocomplete="off">
          <button class="send-button">إرسال</button>
        </form>
    </div>
  </div>
  </div>

  <script>
    const PREFIX = 'xo-elmasry-game-';
    const $ = id => document.getElementById(id);

    let peer, conn, myMark;
    let board, round = 0, turn, over = false;
    const score = { X: 0, O: 0, D: 0 };
    let unreadMessages = 0;
    const LINES = [[0, 1, 2], [3, 4, 5], [6, 7, 8], [0, 3, 6], [1, 4, 7], [2, 5, 8], [0, 4, 8], [2, 4, 6]];

    // ---------- بناء اللوحة ----------
    const cells = [];
    for (let i = 0; i < 9; i++) {
      const c = document.createElement('div');
      c.className = 'cell';
      c.onclick = () => tryMove(i);
      $('board').appendChild(c);
      cells.push(c);
    }

    function newRound(r) {
      round = r;
      board = Array(9).fill(null);
      turn = round % 2 === 0 ? 'X' : 'O';   // اللي يبدأ بيتبدل كل جولة
      over = false;
      $('againBtn').classList.add('hidden');
      render();
    }

    function render() {
      cells.forEach((c, i) => {
        c.textContent = board[i] || '';
        c.className = 'cell' + (board[i] ? ' ' + board[i].toLowerCase() : '');
      });
      if (!over) {
        $('status').textContent = turn === myMark ? '🎯 دورك' : '⏳ دور صاحبك';
      }
      $('scoreX').textContent = score.X;
      $('scoreO').textContent = score.O;
      $('scoreD').textContent = score.D;
    }

    function checkEnd() {
      for (const l of LINES) {
        const [a, b, c] = l;
        if (board[a] && board[a] === board[b] && board[a] === board[c]) {
          over = true;
          score[board[a]]++;
          render();
          l.forEach(i => cells[i].classList.add('win'));
          $('status').textContent = board[a] === myMark ? '🎉 كسبت!' : '😅 صاحبك كسب';
          $('againBtn').classList.remove('hidden');
          return;
        }
      }
      if (board.every(Boolean)) {
        over = true;
        score.D++;
        render();
        $('status').textContent = '🤝 تعادل';
        $('againBtn').classList.remove('hidden');
      }
    }

    function applyMove(i, mark) {
      if (over || board[i] || mark !== turn) return false;
      board[i] = mark;
      turn = mark === 'X' ? 'O' : 'X';
      render();
      checkEnd();
      return true;
    }

    function tryMove(i) {
      if (!conn || turn !== myMark) return;
      if (applyMove(i, myMark)) send({ type: 'move', i });
    }

    $('againBtn').onclick = () => {
      newRound(round + 1);
      send({ type: 'reset', round });
    };

    // ---------- الشات ----------
    function addMsg(text, who) {
      const d = document.createElement('div');
      d.className = 'msg ' + who;
      d.textContent = text;
      $('msgs').appendChild(d);
      $('msgs').scrollTop = $('msgs').scrollHeight;
      if (who === 'them' && $('chatPanel').classList.contains('hidden')) {
        unreadMessages++;
        $('chatBadge').textContent = unreadMessages > 99 ? '99+' : unreadMessages;
        $('chatBadge').classList.remove('hidden');
      }
    }

    function setChatOpen(open) {
      $('chatPanel').classList.toggle('hidden', !open);
      $('game').classList.toggle('chat-open', open);
      $('chatToggle').setAttribute('aria-expanded', String(open));
      if (open) {
        unreadMessages = 0;
        $('chatBadge').classList.add('hidden');
        $('chatInput').focus();
      }
    }

    $('chatToggle').onclick = () => setChatOpen($('chatPanel').classList.contains('hidden'));
    $('chatClose').onclick = () => setChatOpen(false);

    $('chatForm').onsubmit = e => {
      e.preventDefault();
      const t = $('chatInput').value.trim();
      if (!t || !conn) return;
      send({ type: 'chat', text: t });
      addMsg(t, 'me');
      $('chatInput').value = '';
    };

    // ---------- الاتصال ----------
    function send(data) { if (conn && conn.open) conn.send(data); }

    function onData(d) {
      if (!d || typeof d !== 'object') return;
      if (d.type === 'move') applyMove(d.i, myMark === 'X' ? 'O' : 'X');
      else if (d.type === 'chat') addMsg(String(d.text).slice(0, 300), 'them');
      else if (d.type === 'reset' && d.round > round) newRound(d.round);
    }

    function setupConn(c) {
      conn = c;
      conn.on('open', startGame);
      conn.on('data', onData);
      conn.on('close', () => {
        addMsg('صاحبك خرج من اللعبة 👋', 'sys');
        $('status').textContent = 'الاتصال اتقطع';
        over = true;
        conn = null;
      });
    }

    function startGame() {
      $('lobby').classList.add('hidden');
      $('game').classList.remove('hidden');
      $('youMark').textContent = myMark;
      $('youMark').className = myMark.toLowerCase();
      addMsg('صاحبك دخل! يلا نلعب 🎮', 'sys');
      newRound(0);
    }

    function randomCode() {
      return Math.random().toString(36).slice(2, 8);
    }

    // صاحب الغرفة
    function createRoom() {
      $('createBtn').disabled = true;
      $('lobbyMsg').textContent = 'بيجهز الغرفة...';
      const code = randomCode();
      peer = new Peer(PREFIX + code);
      peer.on('open', () => {
        myMark = 'X';
        const url = location.origin + location.pathname + '?room=' + code;
        $('linkInput').value = url;
        $('createBtn').classList.add('hidden');
        $('waiting').classList.remove('hidden');
        $('lobbyMsg').textContent = '';
      });
      peer.on('connection', c => {
        if (conn) { c.on('open', () => c.close()); return; } // الغرفة مليانة
        setupConn(c);
      });
      peer.on('error', err => {
        if (err.type === 'unavailable-id') { peer.destroy(); createRoom(); return; }
        $('lobbyMsg').textContent = 'حصلت مشكلة: ' + err.type;
        $('createBtn').disabled = false;
      });
    }

    // اللي داخل باللينك
    function joinRoom(code) {
      $('createBtn').classList.add('hidden');
      $('lobbyMsg').textContent = 'بيدخل الغرفة...';
      myMark = 'O';
      peer = new Peer();
      peer.on('open', () => setupConn(peer.connect(PREFIX + code, { reliable: true })));
      peer.on('error', err => {
        $('lobbyMsg').textContent = err.type === 'peer-unavailable'
          ? 'الغرفة دي مش موجودة أو صاحبها قفلها 😕'
          : 'حصلت مشكلة: ' + err.type;
      });
    }

    $('createBtn').onclick = createRoom;
    $('copyBtn').onclick = () => {
      const inp = $('linkInput');
      inp.select();
      (navigator.clipboard ? navigator.clipboard.writeText(inp.value) : Promise.reject())
        .catch(() => document.execCommand('copy'));
      $('copyBtn').textContent = 'اتنسخ ✓';
      setTimeout(() => $('copyBtn').textContent = 'نسخ', 1500);
    };

    const roomCode = new URLSearchParams(location.search).get('room');
    if (roomCode) joinRoom(roomCode);
  </script>
</body>

</html>
