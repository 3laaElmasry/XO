<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>XO أونلاين</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root{
    --bg:#0f172a; --card:#1e293b; --line:#334155; --text:#e2e8f0; --muted:#94a3b8;
    --x:#38bdf8; --o:#f472b6; --accent:#22c55e; --warn:#f59e0b;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);
    font-family:system-ui,"Segoe UI",Tahoma,sans-serif;display:flex;justify-content:center;padding:16px}
  .wrap{width:100%;max-width:820px}
  h1{text-align:center;margin:8px 0 16px;font-size:28px}
  h1 .x{color:var(--x)} h1 .o{color:var(--o)}
  .card{background:var(--card);border-radius:16px;padding:16px;margin-bottom:16px}
  .center{text-align:center}
  button{background:var(--accent);color:#04130a;border:0;border-radius:10px;padding:10px 18px;
    font-size:16px;font-weight:700;cursor:pointer}
  button:disabled{opacity:.4;cursor:default}
  button.ghost{background:transparent;color:var(--text);border:1px solid var(--line)}
  .linkbox{display:flex;gap:8px;margin-top:12px}
  .linkbox input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px;font-size:14px;direction:ltr}
  .muted{color:var(--muted);font-size:14px}
  .game{display:grid;grid-template-columns:1fr 300px;gap:16px}
  @media (max-width:720px){.game{grid-template-columns:1fr}}
  .status{text-align:center;font-size:18px;font-weight:700;min-height:28px;margin-bottom:10px}
  .score{display:flex;justify-content:center;gap:18px;margin-bottom:12px;font-size:15px}
  .score b.x{color:var(--x)} .score b.o{color:var(--o)}
  .board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:340px;margin:0 auto;direction:ltr}
  .cell{aspect-ratio:1;background:var(--bg);border-radius:12px;display:flex;align-items:center;
    justify-content:center;font-size:56px;font-weight:800;cursor:pointer;user-select:none;transition:background .15s}
  .cell:hover{background:#172036}
  .cell.x{color:var(--x)} .cell.o{color:var(--o)}
  .cell.win{background:#14532d}
  .actions{text-align:center;margin-top:14px}
  .chat{display:flex;flex-direction:column;height:420px}
  @media (max-width:720px){.chat{height:300px}}
  .msgs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px;padding:4px}
  .msg{max-width:85%;padding:7px 11px;border-radius:12px;font-size:15px;word-wrap:break-word}
  .msg.me{align-self:flex-start;background:#0c4a6e}
  .msg.them{align-self:flex-end;background:#831843}
  .msg.sys{align-self:center;background:transparent;color:var(--muted);font-size:13px}
  .chatform{display:flex;gap:6px;margin-top:8px}
  .chatform input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);color:var(--text);
    border-radius:10px;padding:10px;font-size:15px}
  .hidden{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <h1><span class="x">X</span><span class="o">O</span> أونلاين</h1>

  <!-- شاشة البداية -->
  <div id="lobby" class="card center">
    <p>اعمل غرفة وابعت اللينك لصاحبك عشان يلعب معاك.</p>
    <button id="createBtn">إنشاء غرفة</button>
    <div id="waiting" class="hidden">
      <p class="muted">ابعت اللينك ده لصاحبك:</p>
      <div class="linkbox">
        <input id="linkInput" readonly>
        <button id="copyBtn">نسخ</button>
      </div>
      <p class="muted" style="margin-top:14px">⏳ مستني صاحبك يدخل...</p>
    </div>
    <p id="lobbyMsg" class="muted"></p>
  </div>

  <!-- شاشة اللعب -->
  <div id="game" class="game hidden">
    <div class="card">
      <div class="score">
        <span>أنت: <b id="youMark"></b></span>
        <span><b class="x">X</b> <span id="scoreX">0</span> - <span id="scoreO">0</span> <b class="o">O</b></span>
        <span>تعادل: <span id="scoreD">0</span></span>
      </div>
      <div id="status" class="status"></div>
      <div id="board" class="board"></div>
      <div class="actions">
        <button id="againBtn" class="hidden">جولة جديدة</button>
      </div>
    </div>
    <div class="card chat">
      <div id="msgs" class="msgs"></div>
      <form id="chatForm" class="chatform">
        <input id="chatInput" placeholder="اكتب رسالة..." maxlength="300" autocomplete="off">
        <button>إرسال</button>
      </form>
    </div>
  </div>
</div>

<script>
const PREFIX = 'xo-elmasry-game-';
const $ = id => document.getElementById(id);

let peer, conn, myMark;
let board, round = 0, turn, over = false;
const score = { X:0, O:0, D:0 };
const LINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

// ---------- بناء اللوحة ----------
const cells = [];
for (let i = 0; i < 9; i++) {
  const c = document.createElement('div');
  c.className = 'cell';
  c.onclick = () => tryMove(i);
  $('board').appendChild(c);
  cells.push(c);
}

function newRound(r) {
  round = r;
  board = Array(9).fill(null);
  turn = round % 2 === 0 ? 'X' : 'O';   // اللي يبدأ بيتبدل كل جولة
  over = false;
  $('againBtn').classList.add('hidden');
  render();
}

function render() {
  cells.forEach((c, i) => {
    c.textContent = board[i] || '';
    c.className = 'cell' + (board[i] ? ' ' + board[i].toLowerCase() : '');
  });
  if (!over) {
    $('status').textContent = turn === myMark ? '🎯 دورك' : '⏳ دور صاحبك';
  }
  $('scoreX').textContent = score.X;
  $('scoreO').textContent = score.O;
  $('scoreD').textContent = score.D;
}

function checkEnd() {
  for (const l of LINES) {
    const [a,b,c] = l;
    if (board[a] && board[a] === board[b] && board[a] === board[c]) {
      over = true;
      score[board[a]]++;
      render();
      l.forEach(i => cells[i].classList.add('win'));
      $('status').textContent = board[a] === myMark ? '🎉 كسبت!' : '😅 صاحبك كسب';
      $('againBtn').classList.remove('hidden');
      return;
    }
  }
  if (board.every(Boolean)) {
    over = true;
    score.D++;
    render();
    $('status').textContent = '🤝 تعادل';
    $('againBtn').classList.remove('hidden');
  }
}

function applyMove(i, mark) {
  if (over || board[i] || mark !== turn) return false;
  board[i] = mark;
  turn = mark === 'X' ? 'O' : 'X';
  render();
  checkEnd();
  return true;
}

function tryMove(i) {
  if (!conn || turn !== myMark) return;
  if (applyMove(i, myMark)) send({ type:'move', i });
}

$('againBtn').onclick = () => {
  newRound(round + 1);
  send({ type:'reset', round });
};

// ---------- الشات ----------
function addMsg(text, who) {
  const d = document.createElement('div');
  d.className = 'msg ' + who;
  d.textContent = text;
  $('msgs').appendChild(d);
  $('msgs').scrollTop = $('msgs').scrollHeight;
}

$('chatForm').onsubmit = e => {
  e.preventDefault();
  const t = $('chatInput').value.trim();
  if (!t || !conn) return;
  send({ type:'chat', text:t });
  addMsg(t, 'me');
  $('chatInput').value = '';
};

// ---------- الاتصال ----------
function send(data) { if (conn && conn.open) conn.send(data); }

function onData(d) {
  if (!d || typeof d !== 'object') return;
  if (d.type === 'move') applyMove(d.i, myMark === 'X' ? 'O' : 'X');
  else if (d.type === 'chat') addMsg(String(d.text).slice(0, 300), 'them');
  else if (d.type === 'reset' && d.round > round) newRound(d.round);
}

function setupConn(c) {
  conn = c;
  conn.on('open', startGame);
  conn.on('data', onData);
  conn.on('close', () => {
    addMsg('صاحبك خرج من اللعبة 👋', 'sys');
    $('status').textContent = 'الاتصال اتقطع';
    over = true;
    conn = null;
  });
}

function startGame() {
  $('lobby').classList.add('hidden');
  $('game').classList.remove('hidden');
  $('youMark').textContent = myMark;
  $('youMark').className = myMark.toLowerCase();
  addMsg('صاحبك دخل! يلا نلعب 🎮', 'sys');
  newRound(0);
}

function randomCode() {
  return Math.random().toString(36).slice(2, 8);
}

// صاحب الغرفة
function createRoom() {
  $('createBtn').disabled = true;
  $('lobbyMsg').textContent = 'بيجهز الغرفة...';
  const code = randomCode();
  peer = new Peer(PREFIX + code);
  peer.on('open', () => {
    myMark = 'X';
    const url = location.origin + location.pathname + '?room=' + code;
    $('linkInput').value = url;
    $('createBtn').classList.add('hidden');
    $('waiting').classList.remove('hidden');
    $('lobbyMsg').textContent = '';
  });
  peer.on('connection', c => {
    if (conn) { c.on('open', () => c.close()); return; } // الغرفة مليانة
    setupConn(c);
  });
  peer.on('error', err => {
    if (err.type === 'unavailable-id') { peer.destroy(); createRoom(); return; }
    $('lobbyMsg').textContent = 'حصلت مشكلة: ' + err.type;
    $('createBtn').disabled = false;
  });
}

// اللي داخل باللينك
function joinRoom(code) {
  $('createBtn').classList.add('hidden');
  $('lobbyMsg').textContent = 'بيدخل الغرفة...';
  myMark = 'O';
  peer = new Peer();
  peer.on('open', () => setupConn(peer.connect(PREFIX + code, { reliable:true })));
  peer.on('error', err => {
    $('lobbyMsg').textContent = err.type === 'peer-unavailable'
      ? 'الغرفة دي مش موجودة أو صاحبها قفلها 😕'
      : 'حصلت مشكلة: ' + err.type;
  });
}

$('createBtn').onclick = createRoom;
$('copyBtn').onclick = () => {
  const inp = $('linkInput');
  inp.select();
  (navigator.clipboard ? navigator.clipboard.writeText(inp.value) : Promise.reject())
    .catch(() => document.execCommand('copy'));
  $('copyBtn').textContent = 'اتنسخ ✓';
  setTimeout(() => $('copyBtn').textContent = 'نسخ', 1500);
};

const roomCode = new URLSearchParams(location.search).get('room');
if (roomCode) joinRoom(roomCode);
</script>
</body>
</html>
